apply plugin: 'com.android.application'

def releaseKeystore = System.getenv('LYRICFLOW_KEYSTORE')
// Optional per-CPU APKs, while retaining the universal APK used for in-app updates.
def buildAbiSplits = (System.getenv('LYRICFLOW_ABI_SPLITS') ?: 'false').toBoolean()
def optimizeRelease = (System.getenv('LYRICFLOW_OPTIMIZE_RELEASE') ?: 'true').toBoolean()
def optimizeDebug = (System.getenv('LYRICFLOW_OPTIMIZE_DEBUG') ?: 'false').toBoolean()

android {
    ndkVersion = '27.2.12479018'
    namespace = "com.steveharrisantony.lyricflow"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.steveharrisantony.lyricflow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('LYRICFLOW_VERSION_CODE') ?: '2')
        versionName System.getenv('LYRICFLOW_VERSION_NAME') ?: '1.1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Native Node.js ships one runtime per CPU architecture. Single-ABI APKs
    // avoid shipping the other architectures to each device.
    splits {
        abi {
            enable buildAbiSplits
            if (buildAbiSplits) {
                reset()
                include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            universalApk true
        }
    }
    if (releaseKeystore) {
        signingConfigs {
            persistentRelease {
                storeFile file(releaseKeystore)
                storePassword System.getenv('LYRICFLOW_STORE_PASSWORD')
                keyAlias System.getenv('LYRICFLOW_KEY_ALIAS')
                keyPassword System.getenv('LYRICFLOW_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // Keep routine development/emulator tests unminified. The optional
        // GitHub debug APK can use the same shrinking as release.
        debug {
            minifyEnabled optimizeDebug
            shrinkResources optimizeDebug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            if (releaseKeystore) signingConfig signingConfigs.persistentRelease
            // Capacitor 8.6 supports the R8 optimizer. Keep all registered
            // native plugins through the explicit ProGuard keep rules.
            minifyEnabled optimizeRelease
            shrinkResources optimizeRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'androidx.media:media:1.8.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
