name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: 'Publish a signed APK update after manual preview approval'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_FIREBASE_GOOGLE_WEB_CLIENT_ID }}
  VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.signing.outputs.release }}
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set app version
        id: version
        shell: bash
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          name="1.1.${GITHUB_RUN_NUMBER}"
          echo "LYRICFLOW_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "LYRICFLOW_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$name" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Prepare persistent release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$STORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Signing is not configured; building a test APK. In-app releases require a persistent private signing key."
            exit 0
          fi
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyricflow-release.jks"
          chmod 600 "$RUNNER_TEMP/lyricflow-release.jks"
          echo "LYRICFLOW_KEYSTORE=$RUNNER_TEMP/lyricflow-release.jks" >> "$GITHUB_ENV"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native runtime build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Check application logic
        run: npm test
      - name: Build and copy bundled web application
        run: npm run android:sync
      - name: Audit packaged web and local backend size
        run: npm run size:audit
      - name: Test bundled on-device backend
        run: npm run test:backend
      - name: Build installable APK
        working-directory: android
        env:
          LYRICFLOW_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          LYRICFLOW_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          LYRICFLOW_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          LYRICFLOW_ABI_SPLITS: 'true'
        run: |
          chmod +x gradlew
          if [ -n "$LYRICFLOW_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi
      - name: Name universal and device-optimized APKs
        shell: bash
        run: |
          mkdir -p artifacts
          variant=debug
          if [ -n "$LYRICFLOW_KEYSTORE" ]; then variant=release; fi
          dir="android/app/build/outputs/apk/$variant"
          if [ -f "$dir/app-universal-$variant.apk" ]; then
            cp "$dir/app-universal-$variant.apk" artifacts/LyricFlow-Android.apk
          else
            cp "$dir/app-$variant.apk" artifacts/LyricFlow-Android.apk
          fi
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            if [ -f "$dir/app-$abi-$variant.apk" ]; then
              cp "$dir/app-$abi-$variant.apk" "artifacts/LyricFlow-Android-$abi.apk"
            fi
          done
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          for apk in artifacts/*.apk; do
            echo "$(basename "$apk"): $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Show APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/LyricFlow-Android.apk \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The universal APK retains the exact name expected by in-app updates.
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-Android
          path: artifacts/LyricFlow-Android.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-Android-arm64-v8a
          path: artifacts/LyricFlow-Android-arm64-v8a.apk
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-Android-armeabi-v7a
          path: artifacts/LyricFlow-Android-armeabi-v7a.apk
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-Android-x86_64
          path: artifacts/LyricFlow-Android-x86_64.apk
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-Android-x86
          path: artifacts/LyricFlow-Android-x86.apk
          if-no-files-found: ignore
          retention-days: 30

  publish-update:
    needs: apk
    if: needs.apk.outputs.release == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_update == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LyricFlow-Android
          path: release
      - name: Publish signed update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.apk.outputs.version_name }}
        shell: bash
        run: |
          tag="android-${VERSION_CODE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This version has already been published; leaving its APK unchanged."
            exit 0
          fi
          printf '%s\n' "LyricFlow ${VERSION_NAME}" "" "Signed Android update. Install through App updates inside LyricFlow or download the APK directly. Emulator tests are available separately in the Android Emulator Tests workflow." > "$RUNNER_TEMP/update-notes.md"
          gh release create "$tag" release/LyricFlow-Android.apk --target "$GITHUB_SHA" --title "LyricFlow ${VERSION_NAME}" --notes-file "$RUNNER_TEMP/update-notes.md"
