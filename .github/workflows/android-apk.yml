name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.signing.outputs.release }}
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set app version
        id: version
        shell: bash
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          name="1.1.${GITHUB_RUN_NUMBER}"
          echo "LYRICFLOW_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "LYRICFLOW_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$name" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Prepare persistent release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$STORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Signing is not configured; building a test APK. In-app releases require a persistent private signing key."
            exit 0
          fi
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyricflow-release.jks"
          chmod 600 "$RUNNER_TEMP/lyricflow-release.jks"
          echo "LYRICFLOW_KEYSTORE=$RUNNER_TEMP/lyricflow-release.jks" >> "$GITHUB_ENV"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native runtime build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Check application logic
        run: npm test
      - name: Build and copy bundled web application
        run: npm run android:sync
      - name: Test bundled on-device backend
        run: npm run test:backend
      - name: Build installable APK
        working-directory: android
        env:
          LYRICFLOW_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          LYRICFLOW_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          LYRICFLOW_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$LYRICFLOW_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi
      - name: Name the APK
        run: |
          mkdir -p artifacts
          if [ -n "$LYRICFLOW_KEYSTORE" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/LyricFlow-Android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/LyricFlow-Android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-Android
          path: artifacts/LyricFlow-Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify embedded backend on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-device-test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  publish-update:
    needs: apk
    if: needs.apk.outputs.release == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LyricFlow-Android
          path: release
      - name: Publish tested signed update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.apk.outputs.version_name }}
        shell: bash
        run: |
          tag="android-${VERSION_CODE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This version has already been published; leaving its APK unchanged."
            exit 0
          fi
          printf '%s\n' "LyricFlow ${VERSION_NAME}" "" "Signed Android update. Install through App updates inside LyricFlow or download the APK directly." > "$RUNNER_TEMP/update-notes.md"
          gh release create "$tag" release/LyricFlow-Android.apk --target "$GITHUB_SHA" --title "LyricFlow ${VERSION_NAME}" --notes-file "$RUNNER_TEMP/update-notes.md"
